plugins {
    id 'com.android.application'
}

android {
    namespace 'cm.saintjacquet.transit'
    compileSdk 35

    defaultConfig {
        applicationId 'cm.saintjacquet.transit'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0-demo'
    }

    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/web-assets'))
}

def copyWebAssets = tasks.register('copyWebAssets', Sync) {
    from(rootProject.file('../app_transit_logistique.html'))
    from(rootProject.file('../assets')) { into 'assets' }
    into(layout.buildDirectory.dir('generated/web-assets'))
}
tasks.named('preBuild').configure { dependsOn(copyWebAssets) }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
