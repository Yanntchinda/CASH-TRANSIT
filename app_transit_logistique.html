<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3fa8">
<title>Saint Jacquet Distribution</title>
<link rel="icon" type="image/png" href="assets/icon-fast-cargo.png">
<link rel="apple-touch-icon" href="assets/icon-fast-cargo.png">
<meta name="apple-mobile-web-app-title" content="Saint Jacquet">
<meta name="application-name" content="Saint Jacquet Distribution">
<style>
:root{--blue:#0b3fa8;--ink:#0a1f5c;--muted:#5d6b8a;--line:#e6ebf5;--bg:#eef2fb;--ok:#12805c;--ko:#c0392b;--wa:#b86e00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Roboto,"Segoe UI",system-ui,Arial,sans-serif;background:linear-gradient(135deg,#e9effb,#d2e0fa);color:var(--ink);display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:430px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:500px){.app{height:min(900px,96vh);border-radius:36px;box-shadow:0 20px 60px rgba(10,31,92,.25);border:8px solid #1c2740}}
.main{flex:1;overflow-y:auto;padding:16px 14px 20px}
.main.nopad{padding:0}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hero{background:var(--blue);color:#fff;border-radius:10px;padding:22px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 16px rgba(11,63,168,.3)}
.hero svg{width:30px;height:30px}
.hero h1{margin:0;font-size:22px;line-height:1.15;letter-spacing:.2px}
.sub{display:flex;align-items:center;gap:8px;margin:10px 2px 14px;font-size:13px;color:#1b4aa8}
.flag{width:26px;height:18px;border-radius:3px;background:linear-gradient(90deg,#007a5e 33.3%,#ce1126 33.3% 66.6%,#fcd116 66.6%);position:relative;flex:none}
.flag:after{content:"★";color:#fcd116;font-size:9px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
/* slider */
.slider{position:relative;border-radius:14px;overflow:hidden;height:190px;box-shadow:0 6px 16px rgba(11,63,168,.25);background:#0b3fa8}
.track{display:flex;height:100%;transition:transform .6s ease}
.slide{min-width:100%;height:100%;position:relative}
.slide>svg,.slide>img{width:100%;height:100%;display:block;object-fit:cover;fill:currentColor;stroke:none;stroke-width:0}
.cap{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 24px;color:#fff;background:linear-gradient(transparent,rgba(5,20,70,.85))}
.cap b{display:block;font-size:18px}.cap span{font-size:12.5px;opacity:.95}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer}
.dots i.on{background:#fff;width:20px;border-radius:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats.s2{grid-template-columns:1fr 1fr}
.stat{background:#fff;border-radius:10px;padding:10px 8px;text-align:center;box-shadow:0 2px 8px rgba(10,31,92,.06)}
.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px rgba(10,31,92,.08)}
.card-h{display:flex;gap:12px;align-items:flex-start}
.card-h .ico{color:var(--blue);padding-top:2px}
.card-h>div:nth-child(2){flex:1}
h2{margin:0 0 3px;font-size:18px}.card p{margin:0;font-size:13px;color:#2a3a66}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn.sm{padding:8px 12px}.btn.full{width:100%;padding:13px;font-size:15px;margin-top:6px}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.danger{background:#fff;color:var(--ko);border:1px solid var(--ko)}
.btn.ok{background:var(--ok)}
.btn.wabtn{background:#128c4a}
a.btn{text-decoration:none;text-align:center;display:inline-block}
.wa{color:var(--blue);font-weight:700;text-decoration:none;word-break:break-all}
.btn[disabled]{background:#b9c3da;cursor:not-allowed}
.chips{display:flex;gap:6px;overflow-x:auto;margin:12px 0 2px;padding-bottom:2px}
.chip{border:1px solid var(--line);background:#fafcff;border-radius:20px;padding:7px 12px;font:600 12.5px inherit;font-family:inherit;color:#34456f;white-space:nowrap;display:flex;gap:5px;align-items:center;cursor:pointer}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 8px}
.fld{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#fafcff;min-height:42px;color:var(--blue)}
.fld span{font-size:13px;color:#3d4c75;white-space:nowrap}
.fld select,.fld input{border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);width:100%;min-width:0;padding:10px 0;outline:none}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.box{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 10px;font:inherit;font-size:14px;background:#fafcff;color:var(--ink);outline:none}
.box:focus,.fld:focus-within{border-color:var(--blue)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg label{border:1px solid var(--line);border-radius:8px;padding:10px 4px;text-align:center;font-size:13px;cursor:pointer;background:#fafcff;display:flex;flex-direction:column;align-items:center;gap:4px}
.seg input{display:none}.seg input:checked+span{color:var(--blue);font-weight:700}
.seg label:has(input:checked){border-color:var(--blue);background:#eaf0ff;color:var(--blue)}
.trip{display:flex;gap:10px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.trip:first-of-type{margin-top:12px}
.trip .ti{color:var(--blue)}.trip .tm{flex:1;min-width:0}
.trip b{font-size:15px;display:block}.trip small{display:block;font-size:11.5px;color:#34456f;margin-top:2px;line-height:1.4}
.trip em{font-style:normal;font-size:11px;color:var(--muted);display:block;margin-top:1px}
.tag{display:inline-block;font-size:10.5px;background:#eaf0ff;color:var(--blue);border-radius:20px;padding:2px 8px;margin-left:6px;vertical-align:middle;font-weight:600}
.more{text-align:center;padding-top:10px}.more button{background:none;border:0;color:var(--blue);font:600 13px inherit;font-family:inherit;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;text-align:center}
.st.ok{background:#e0f5ec;color:var(--ok)}.st.ko{background:#fbe6e3;color:var(--ko)}
.st.tr{background:#e3ecff;color:var(--blue)}.st.dn{background:#eceff5;color:#4a5878}.st.wa{background:#fff1d6;color:var(--wa)}
.resa-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.resa-l{font-size:13px;color:#34456f;line-height:1.6;margin-top:6px}
.actions{display:flex;gap:8px;margin-top:10px}.actions .btn{flex:1}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px;gap:10px}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
nav:empty{display:none}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12px inherit;font-family:inherit;color:#44547d;cursor:pointer;position:relative}
nav button.on{color:var(--blue)}
nav .bd{position:absolute;top:-4px;left:calc(50% + 6px);background:var(--ko);color:#fff;font-size:10px;border-radius:10px;padding:1px 5px}
#sheetbg{position:absolute;inset:0;background:rgba(10,31,92,.45);display:none;align-items:flex-end;z-index:5}
#sheetbg.open{display:flex}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:92%;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:18px}
.pay label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:7px;font-size:14px;cursor:pointer}
.total{display:flex;justify-content:space-between;font-size:16px;font-weight:700;margin:14px 0 4px}
.note{font-size:12px;color:var(--muted);background:#f3f6fd;border-radius:8px;padding:9px 10px;margin-top:10px;line-height:1.4}
#toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#0a1f5c;color:#fff;padding:10px 16px;border-radius:24px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
/* connexion */
.main.nopad{background:linear-gradient(180deg,rgba(5,25,51,.34),rgba(5,20,45,.84)),url('assets/fond-connexion.jpg') center center/cover no-repeat}
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px 18px 30px;color:#fff}
.lg-top{text-align:center;padding:0 0 20px}
.lg-top img{display:block;margin:0 auto;width:155px;max-width:60%;height:auto;padding:12px;background:rgba(226,239,246,.88);border-radius:22px;box-shadow:0 10px 30px rgba(2,17,38,.2)}
.lg-top h1{margin:16px 0 4px;font-size:24px;letter-spacing:.2px}
.lg-top p{margin:0;color:#d9e7f3;font-size:13px}
.lg-card{background:rgba(5,27,53,.78);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:18px;box-shadow:0 16px 36px rgba(1,12,29,.3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lg-card .lbl{color:#e1ebf5}
.lg-card .box{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff}
.lg-card .box::placeholder{color:#b6c7d7;opacity:1}
.lg-card .box:focus{border-color:#a7d3ff;outline:2px solid rgba(167,211,255,.3)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.1);border-radius:10px;padding:4px;gap:4px;margin-bottom:6px}
.seg2 button{border:0;background:transparent;border-radius:8px;padding:11px 6px;font:600 13px inherit;font-family:inherit;color:#dce9f6;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.seg2 button svg{width:18px;height:18px}
.seg2 button.on{background:#2464b9;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.link{background:none;border:0;color:#d5eaff;font:600 13px inherit;font-family:inherit;cursor:pointer;display:block;margin:12px auto 0}
.link:focus-visible,.seg2 button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="main" id="main"></div>
  <nav id="nav"></nav>
  <div id="sheetbg" data-act="closebg"><div class="sheet" id="sheet"></div></div>
  <div id="toast"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const toInput = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const nf = new Intl.NumberFormat("fr-FR");
const money = n => nf.format(Math.round(n)) + " FCFA";
const perKg = n => nf.format(n) + " FCFA/kg";
const fmtKg = n => n >= 1000 ? (n/1000).toLocaleString("fr-FR",{maximumFractionDigits:1}) + " t" : nf.format(n) + " kg";
const rid = () => Math.random().toString(36).slice(2,9);
const uniq = a => [...new Set(a)];

async function sha(s){
  const str = "tl::" + s;
  try { if (window.crypto && crypto.subtle){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join(""); } } catch(e){}
  let h = 5381; for (const c of str) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return "d" + h;
}

const LOGO = "assets/logo-fast-cargo-transparent.png";

const I = {
  pin:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  plane:'<svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>',
  ship:'<svg viewBox="0 0 24 24"><path d="M3 15h18l-2.2 5H5.2zM6 15V9h12v6M9 9V5h6v4M12 2v3"/></svg>',
  all:'<svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  calok:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>',
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18c1.5-2.5 3.2-3.5 5.5-3.5s4 1 5.5 3.5"/></svg>',
  shield:'<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  grid:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  out:'<svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>'
};

/* ---------- Images du slider (illustrations SVG ; remplacez par vos photos via le champ "photo") ---------- */
const cont = (x,y,c) => `<rect x="${x}" y="${y}" width="24" height="13" fill="${c}"/><rect x="${x}" y="${y}" width="24" height="2" fill="#fff" opacity=".25"/>`;
const C = ["#e4572e","#2e86ab","#f6b93b","#3aa57a","#8e5ea2","#e4572e","#2e86ab","#f08a24"];
const SV_AIR = `<svg viewBox="0 0 400 190" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b3fa8"/><stop offset="1" stop-color="#8fc1ff"/></linearGradient></defs>
<rect width="400" height="190" fill="url(#g1)"/>
<g fill="#fff" opacity=".85"><ellipse cx="70" cy="140" rx="55" ry="14"/><ellipse cx="110" cy="132" rx="35" ry="12"/><ellipse cx="330" cy="58" rx="45" ry="11"/><ellipse cx="300" cy="172" rx="70" ry="14"/></g>
<g transform="translate(-8,-14)">
<path d="M70 108 Q66 93 92 91 L282 91 Q325 91 345 104 L352 112 Q328 123 282 123 L92 123 Q70 123 70 108Z" fill="#fff"/>
<path d="M80 95 L66 58 L96 58 L116 93Z" fill="#e8eefb"/>
<path d="M185 118 L246 160 L276 160 L240 112Z" fill="#c7d4f0"/>
<path d="M185 96 L240 62 L262 62 L236 96Z" fill="#d6e0f7"/>
<rect x="86" y="108" width="236" height="6" fill="#0b3fa8"/>
<ellipse cx="222" cy="138" rx="14" ry="7" fill="#9fb3dd"/>
<path d="M318 98 L338 99 L342 106 L318 106Z" fill="#12306b"/></g></svg>`;
function svSea(){
  let s = `<svg viewBox="0 0 400 190" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf8a"/><stop offset="1" stop-color="#fff0d9"/></linearGradient><linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b63e0"/><stop offset="1" stop-color="#0a2a73"/></linearGradient></defs>
<rect width="400" height="190" fill="url(#g2)"/><circle cx="330" cy="50" r="22" fill="#ffb347" opacity=".9"/><rect y="124" width="400" height="66" fill="url(#w2)"/>`;
  for (let i=0;i<9;i++) s += cont(52+i*26,108,C[i%8]);
  for (let i=0;i<7;i++) s += cont(78+i*26,94,C[(i+3)%8]);
  for (let i=0;i<5;i++) s += cont(104+i*26,80,C[(i+5)%8]);
  s += `<path d="M30 122 L372 122 L346 154 L58 154Z" fill="#14264f"/><rect x="40" y="122" width="324" height="6" fill="#c0392b"/>
<rect x="296" y="76" width="34" height="46" fill="#fff"/><rect x="301" y="62" width="24" height="14" fill="#e8eefb"/>
<g fill="#12306b"><rect x="302" y="84" width="6" height="6"/><rect x="312" y="84" width="6" height="6"/><rect x="322" y="84" width="5" height="6"/><rect x="304" y="66" width="18" height="5"/></g>
<g fill="none" stroke="#fff" stroke-width="2" opacity=".5"><path d="M0 168 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/><path d="M0 180 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/></g></svg>`;
  return s;
}
function svPort(){
  let s = `<svg viewBox="0 0 400 190" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3a8c"/><stop offset="1" stop-color="#f6a96c"/></linearGradient></defs>
<rect width="400" height="190" fill="url(#g3)"/><rect y="150" width="400" height="40" fill="#0f2557"/><rect y="132" width="300" height="24" fill="#33405f"/>`;
  for (let i=0;i<6;i++) s += cont(14+i*26,119,C[i%8]);
  for (let i=0;i<4;i++) s += cont(40+i*26,106,C[(i+2)%8]);
  for (let i=0;i<5;i++) s += cont(170+i*24,119,C[(i+4)%8]);
  s += `<g stroke="#eef3ff" stroke-width="3" fill="none" stroke-linecap="round"><path d="M240 132 L252 52 M296 132 L284 52 M244 90 L292 90"/><path d="M150 52 L340 52"/><path d="M150 52 L252 24 L340 52"/><path d="M312 52 L312 84"/></g>
<rect x="300" y="84" width="24" height="13" fill="#f6b93b"/><rect x="238" y="46" width="60" height="10" fill="#c0392b"/>
<path d="M300 150 L400 150 L400 168 L318 168Z" fill="#14264f"/>`;
  s += `</svg>`; return s;
}
const SV_LOAD = `<svg viewBox="0 0 400 190" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9d4ff"/><stop offset="1" stop-color="#f0f6ff"/></linearGradient></defs>
<rect width="400" height="190" fill="url(#g4)"/><rect y="146" width="400" height="44" fill="#4a5568"/><g fill="#fff" opacity=".35"><rect x="20" y="164" width="40" height="4"/><rect x="100" y="164" width="40" height="4"/><rect x="180" y="164" width="40" height="4"/></g>
<path d="M170 76 Q170 46 214 46 L400 46 L400 138 L214 138 Q170 138 170 108Z" fill="#fff"/>
<rect x="170" y="108" width="230" height="7" fill="#0b3fa8"/>
<path d="M180 62 L205 62 L205 80 L180 80Z" fill="#12306b"/>
<rect x="216" y="70" width="52" height="58" fill="#12306b"/><rect x="216" y="70" width="52" height="58" fill="#1b2f66"/>
<rect x="222" y="108" width="20" height="16" fill="#f6b93b"/><rect x="244" y="108" width="20" height="16" fill="#3aa57a"/><rect x="222" y="90" width="20" height="16" fill="#e4572e"/>
<path d="M60 146 L214 126 L214 146Z" fill="#8a97b3"/>
<rect x="90" y="124" width="34" height="18" fill="#f6b93b"/><rect x="132" y="118" width="34" height="18" fill="#2e86ab"/><rect x="176" y="112" width="30" height="16" fill="#e4572e"/>
<rect x="12" y="108" width="52" height="34" fill="#fff"/><rect x="48" y="116" width="16" height="14" fill="#9fb3dd"/><rect x="8" y="104" width="44" height="6" fill="#0b3fa8"/>
<circle cx="26" cy="146" r="8" fill="#1d2433"/><circle cx="54" cy="146" r="8" fill="#1d2433"/></svg>`;
const SLIDES = [

function when(iso){
  const d = new Date(iso), t = new Date();
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const diff = Math.round((a - b) / 864e5);
  let lab = diff === 0 ? "Aujourd'hui" : diff === 1 ? "Demain" : d.toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","");
  lab = lab.charAt(0).toUpperCase() + lab.slice(1);
  return { lab, date: d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"}), time: d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) };
}
const arrivalDate = (iso, days) => new Date(new Date(iso).getTime() + days*864e5 + (days === 0 ? 4*36e5 : 0));
const fmtDate = d => d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const transitLabel = d => d === 0 ? "même jour" : d + " j";

async function load(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  if (!s || !s.departs){ const D = seed(); s = { departs:D, resas:seedResas(D), users:[], admin:null, session:null }; }
  if (!s.admin) s.admin = { login:"admin", hash:await sha("Admin@2026") };
  const now = new Date();
  if (s.departs.filter(d => !d.custom && new Date(d.when) > now).length < 5) s.departs = s.departs.filter(d => d.custom).concat(seed());
  return s;
}

function resaStatus(r){
  if (r.statut === "attente") return { k:"En attente de validation", c:"wa" };
  if (r.statut === "refusée") return { k:"Refusée", c:"ko" };
  if (r.statut === "annulée") return { k:"Annulée", c:"ko" };
  const now = Date.now();
  if (now < new Date(r.when).getTime()) return { k:"Validée", c:"ok" };
  if (now < arrivalDate(r.when, r.transit).getTime()) return { k:"En transit", c:"tr" };
  return { k:"Livrée", c:"dn" };
}

}
function viewResasAdmin(){
  const F = { all:()=>true, attente:r=>r.statut==="attente", validée:r=>r.statut==="validée", autres:r=>r.statut==="refusée"||r.statut==="annulée" };
  const list = db.resas.filter(F[ui.rf]).sort((a,b) => b.createdAt - a.createdAt);
  const n = k => db.resas.filter(F[k]).length;
  const ch = (k,l) => `<button class="chip ${ui.rf===k?"on":""}" data-act="rfilter" data-id="${k}">${l} (${n(k)})</button>`;
  return `<div class="hero">${I.calok}<h1>RÉSERVATIONS<br>CLIENTS</h1></div>
  <div class="chips">${ch("all","Toutes")}${ch("attente","En attente")}${ch("validée","Validées")}${ch("autres","Refusées / annulées")}</div><div style="height:10px"></div>
  ${list.length ? list.map(r => resaCard(r,true)).join("") : `<section class="card"><div class="empty">Aucune réservation dans cette catégorie.</div></section>`}`;
}
function viewProfileAdmin(){
  return `<div class="hero">${I.shield}<h1>PROFIL<br>ADMINISTRATEUR</h1></div>
  <section class="card" style="margin-top:14px"><h2>Compte</h2>
    <div class="kv"><span>Identifiant</span><b>${esc(db.admin.login)}</b></div>
    <div class="kv"><span>Rôle</span><b>Administrateur</b></div>
  </section>
  <section class="card"><h2>Changer le mot de passe</h2>
    <span class="lbl">Mot de passe actuel</span><input class="box" id="aOld" type="password" autocomplete="current-password">
    <span class="lbl">Nouveau mot de passe (6 caractères min.)</span><input class="box" id="aNew" type="password" autocomplete="new-password">
    <span class="lbl">Confirmer</span><input class="box" id="aNew2" type="password" autocomplete="new-password">
    <button class="btn full" data-act="savepwd">Mettre à jour</button>
  </section>
  <button class="btn full danger" data-act="logout">Se déconnecter</button>
  <button class="btn full ghost" data-act="reset" style="margin-top:10px">Réinitialiser toutes les données</button>`;
}

/* ---------- Rendu ---------- */
function render(){
  const m = $("#main"), top = m.scrollTop, nav = $("#nav");
  if (!db.session){
    clearInterval(sliderTimer); m.className = "main nopad"; m.innerHTML = viewLogin(); nav.innerHTML = ""; m.scrollTop = 0; return;
  }
  m.className = "main";
  const adm = db.session.role === "admin";
  const views = adm ? { dash:viewDash, deps:viewDeps, resas:viewResasAdmin, profile:viewProfileAdmin } : { home:viewHome, resas:viewResasClient, profile:viewProfileClient };
  if (!views[ui.tab]) ui.tab = adm ? "dash" : "home";
  m.innerHTML = views[ui.tab](); m.scrollTop = top;
  const pend = db.resas.filter(r => r.statut === "attente").length;
  const tabs = adm ? [["dash","Tableau",I.grid],["deps","Départs",I.plus],["resas","Réservations",I.cal],["profile","Profil",I.user]]
                   : [["home","Accueil",I.home],["resas","Réservations",I.cal],["profile","Profil",I.user]];
  nav.innerHTML = tabs.map(([k,l,ic]) => `<button class="${ui.tab===k?"on":""}" data-act="tab" data-id="${k}">${ic}${l}${adm&&k==="resas"&&pend?`<span class="bd">${pend}</span>`:""}</button>`).join("");
  startSlider();
}

/* ---------- Réservation (client) ---------- */
function renderSheet(){
  const d = db.departs.find(x => x.id === sheet.id), u = curUser(); if (!d || !u) return closeSheet();
  const w = when(d.when);
  $("#sheet").innerHTML = `
    <h3>Réserver · ${esc(d.from)} → ${esc(d.to)}</h3>
    <p style="margin:0 0 6px;font-size:13px;color:#34456f">${MODE[d.mode].label} · ${w.lab} ${w.date} à ${w.time} · transit ${transitLabel(d.transit)}<br>${esc(d.veh)} · ${esc(d.op)} · ${perKg(d.prix)}</p>
    <span class="lbl">Kilos à réserver — ${fmtKg(d.left)} disponibles</span>
    <input class="box" type="number" id="sKg" min="1" max="${d.left}" value="${sheet.kg}">
    <span class="lbl">Nature de la marchandise</span><select class="box" id="sNat">${NATURES.map(n => `<option>${n}</option>`).join("")}</select>
    <span class="lbl">Expéditeur</span><input class="box" id="sExp" value="${esc(u.nom)}">
    <span class="lbl">Destinataire (nom / société)</span><input class="box" id="sDest" placeholder="Qui réceptionne à l'arrivée ?">
    <span class="lbl">Mode de paiement prévu</span>
    <div class="pay">${Object.entries(PAY).map(([k,v]) => `<label><input type="radio" name="pay" value="${k}" ${k==="momo"?"checked":""}> ${v}</label>`).join("")}</div>
    <div class="total"><span>Total estimé</span><span id="sTotal">${money(d.prix * sheet.kg)}</span></div>
    <div class="note">Votre demande sera <b>en attente de validation</b> par l'administrateur. Les kilos sont mis de côté en attendant sa réponse.</div>
    <button class="btn full" data-act="confirm">Envoyer la demande</button>
    <button class="btn full ghost" data-act="close" style="margin-top:8px">Fermer</button>`;
  $("#sheetbg").classList.add("open");
}
function closeSheet(){ sheet = null; $("#sheetbg").classList.remove("open"); }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2800); }

function syncPublish(m){
  draft.mode = m; draft.from = MODE[m].def[0]; draft.to = MODE[m].def[1];
  $("#pVeh").innerHTML = MODE[m].veh.map(v => `<option>${v}</option>`).join("");
  $("#pFrom").innerHTML = opts(LOC[m], draft.from); $("#pTo").innerHTML = opts(LOC[m], draft.to);
  $("#pCap").value = MODE[m].cap; $("#pPrix").value = MODE[m].prix; $("#pTransit").value = MODE[m].transit;
}
function release(r){ const d = db.departs.find(x => x.id === r.departId); if (d) d.left = Math.min(d.total, d.left + r.kg); }
function enter(session){ db.session = session; ui.tab = session.role === "admin" ? "dash" : "home"; ui.f = {mode:"",from:"",to:""}; ui.all = false; ui.rf = "all"; save(); render(); }

/* ---------- Actions ---------- */
const A = {
  lrole:(id)=>{ ui.lrole = id; ui.lmode = "in"; render(); },
  lmode:(id)=>{ ui.lmode = id; render(); },
  clogin:async()=>{
    const email = normEmail(val("#lEmail")), pwd = $("#lPwd").value;
    if (!email || !pwd) return toast("Renseignez e-mail et mot de passe");
    const h = await sha(pwd), u = db.users.find(x => x.email === email && x.hash === h);
    if (!u) return toast("E-mail ou mot de passe incorrect");
    enter({ role:"client", uid:u.id }); toast("Bienvenue " + u.nom);
  },
  csignup:async()=>{
    const nom = val("#lNom"), tel = val("#lTel"), email = normEmail(val("#lEmail")), p1 = $("#lPwd").value, p2 = $("#lPwd2").value;
    if (nom.length < 2) return toast("Indiquez votre nom");
    if (!validTel(tel)) return toast("Numéro WhatsApp invalide");
    if (!isEmail(email)) return toast("Adresse e-mail invalide");
    if (p1.length < 6) return toast("Mot de passe : 6 caractères minimum");
    if (p1 !== p2) return toast("Les mots de passe ne correspondent pas");
    if (db.users.some(x => x.email === email)) return toast("Cet e-mail a déjà un compte");
    const u = { id:"u"+rid(), nom, tel, email, hash:await sha(p1) }; db.users.push(u);
    enter({ role:"client", uid:u.id }); toast("Compte créé ✔");
  },
  alogin:async()=>{
    const l = val("#lLogin"), pwd = $("#lPwd").value;
    if (!l || !pwd) return toast("Renseignez identifiant et mot de passe");
    if (l !== db.admin.login || await sha(pwd) !== db.admin.hash) return toast("Identifiants administrateur incorrects");
    enter({ role:"admin" });
  },
  logout:()=>{ closeSheet(); db.session = null; ui.lrole = "client"; ui.lmode = "in"; save(); render(); },
  tab:(id)=>{ ui.tab = id; render(); },
  slide:(id)=>{ goSlide(+id); startSlider(); },
  fmode:(id)=>{ ui.f = { mode:id, from:"", to:"" }; ui.all = false; render(); },
  toggleall:()=>{ ui.all = !ui.all; render(); },
  rfilter:(id)=>{ ui.rf = id; render(); },
  book:(id)=>{ const d = db.departs.find(x => x.id === id); if (!d || d.left < 1) return; sheet = { id, kg:Math.min(50, d.left) }; renderSheet(); },
  close:closeSheet,
  closebg:(id,el,e)=>{ if (e.target === el) closeSheet(); },
  confirm:()=>{
    const d = db.departs.find(x => x.id === sheet.id), u = curUser(); if (!d || !u) return;
    const kg = Math.floor(+val("#sKg")), exp = val("#sExp"), dest = val("#sDest"), pay = document.querySelector('input[name="pay"]:checked').value;
    if (!(kg >= 1)) return toast("Indiquez un nombre de kilos valide");
    if (kg > d.left) return toast(`Capacité insuffisante : ${fmtKg(d.left)} disponibles`);
    if (exp.length < 2) return toast("Indiquez l'expéditeur");
    if (dest.length < 2) return toast("Indiquez le destinataire");
    d.left -= kg;
    db.resas.push({ id:"r"+rid(), ref:"FR-"+rid().slice(0,5).toUpperCase(), clientId:u.id, clientNom:u.nom, clientTel:u.tel, clientEmail:u.email, departId:d.id, mode:d.mode, from:d.from, to:d.to, when:d.when,
      transit:d.transit, kg, total:d.prix*kg, nature:val("#sNat"), dest, exp, pay, payLabel:PAY[pay], statut:"attente", createdAt:Date.now() });
    save(); closeSheet(); ui.tab = "resas"; render(); toast("Demande envoyée — en attente de validation");
  },
  cancel:(id)=>{
    const r = db.resas.find(x => x.id === id); if (!r || r.statut !== "attente") return;
    if (!confirm("Annuler cette demande ?")) return;
    r.statut = "annulée"; release(r); save(); render(); toast("Demande annulée");
  },
  validate:(id)=>{ const r = db.resas.find(x => x.id === id); if (!r || r.statut !== "attente") return; r.statut = "validée"; save(); render(); toast("Réservation validée ✔"); },
  reject:(id)=>{
    const r = db.resas.find(x => x.id === id); if (!r || r.statut !== "attente") return;
    if (!confirm("Refuser cette demande ? Les kilos seront remis en vente.")) return;
    r.statut = "refusée"; release(r); save(); render(); toast("Demande refusée");
  },
  publish:()=>{
    const m = document.querySelector('input[name="pMode"]:checked').value;
    const from = val("#pFrom"), to = val("#pTo"), whenV = val("#pWhen"), cap = +val("#pCap"), prix = +val("#pPrix"), transit = +val("#pTransit"), by = val("#pBy");
    if (from === to) return toast("Origine et destination doivent être différentes");
    if (!whenV || new Date(whenV) <= new Date()) return toast("Choisissez une date future");
    if (!(cap >= 1)) return toast("Indiquez la capacité en kg");
    if (!(prix > 0)) return toast("Indiquez un prix au kg valide");
    if (!(transit >= 0)) return toast("Durée de transit invalide");
    if (by.length < 2) return toast("Indiquez la compagnie");
    db.departs.push({ id:"u"+rid(), mode:m, from, to, when:new Date(whenV).toISOString(), total:Math.floor(cap), left:Math.floor(cap), prix, transit:Math.floor(transit), op:by, veh:val("#pVeh"), note:val("#pNote"), custom:true });
    save(); render(); toast("Départ publié ✔ — visible par les clients");
  },
  deldep:(id)=>{
    if (db.resas.some(r => r.departId === id && isActive(r))) return toast("Impossible : des réservations sont liées à ce départ");
    if (!confirm("Retirer ce départ ?")) return;
    db.departs = db.departs.filter(d => d.id !== id); save(); render();
  },
  saveprofile:()=>{ const u = curUser(), nom = val("#uNom"), tel = val("#uTel"); if (!u) return; if (nom.length < 2) return toast("Indiquez un nom valide"); if (!validTel(tel)) return toast("Numéro WhatsApp invalide"); u.nom = nom; u.tel = tel; save(); toast("Profil enregistré ✔"); },
  savepwd:async()=>{
    const o = $("#aOld").value, n = $("#aNew").value, n2 = $("#aNew2").value;
    if (await sha(o) !== db.admin.hash) return toast("Mot de passe actuel incorrect");
    if (n.length < 6) return toast("Nouveau mot de passe : 6 caractères minimum");
    if (n !== n2) return toast("Les mots de passe ne correspondent pas");
    db.admin.hash = await sha(n); save(); render(); toast("Mot de passe mis à jour ✔");
  },
  reset:async()=>{
    if (!confirm("Supprimer TOUTES les données (comptes clients, réservations, départs) et restaurer les exemples ?")) return;
    localStorage.removeItem(KEY); db = await load(); save(); ui = { tab:"home", f:{mode:"",from:"",to:""}, all:false, slide:0, lrole:"client", lmode:"in", rf:"all" }; render(); toast("Données réinitialisées");
  }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset.id, el, e);
});
document.addEventListener("change", e => {
  const t = e.target, id = t.id, v = t.value;
  if (t.name === "pMode") return syncPublish(v);
  const map = { pFrom:"from", pTo:"to", pWhen:"when" };
  if (map[id]) draft[map[id]] = v;
  if (id === "fFrom"){ ui.f.from = v; ui.all = false; render(); }
  if (id === "fTo"){ ui.f.to = v; ui.all = false; render(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "sKg" && sheet){
    const d = db.departs.find(x => x.id === sheet.id), kg = Math.max(0, Math.floor(+e.target.value) || 0);
    sheet.kg = kg; $("#sTotal").textContent = money(d.prix * kg);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheet) closeSheet();
  if (e.key === "Enter" && e.target.closest(".lg-card")){ const b = $("#lgBtn"); if (b) b.click(); }
});
let tx = null;
document.addEventListener("touchstart", e => { if (e.target.closest("#slider")) tx = e.touches[0].clientX; }, { passive:true });
document.addEventListener("touchend", e => {
  if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 40){ goSlide(ui.slide + (dx < 0 ? 1 : -1)); startSlider(); }
});

(async () => { db = await load(); save(); render(); })();
</script>
</body>
</html>
