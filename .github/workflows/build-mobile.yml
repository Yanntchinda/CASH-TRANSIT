name: Compilation Mobile (Android & iOS)

on:
  push:
    branches:
      - main
      - master
      - "arena/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages:
    name: Déployer la Web App iPhone / PWA gratuite (GitHub Pages)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Activation et configuration de GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparation du dossier Web / PWA (www)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./www"

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    name: Compiler Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Configuration de Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Installation des dépendances npm
        run: npm ci

      - name: Synchronisation Capacitor Android
        run: npx cap sync android

      - name: Droits d'exécution Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilation de l'APK installable (Debug) et du Bundle Release (AAB)
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Signature et préparation des fichiers Android
        run: |
          mkdir -p artifacts-android
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts-android/Saint-Jacquet-Distribution-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts-android/Saint-Jacquet-Distribution-release.aab
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK_DIR" ] && [ -d "$SDK_DIR/build-tools" ]; then
            BT="$SDK_DIR/build-tools/$(ls -1 "$SDK_DIR/build-tools" | sort -V | tail -n 1)"
            keytool -genkeypair -v -keystore /tmp/release.p12 -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias saintjacquet -storepass SjDist2026! -keypass SjDist2026! \
              -dname "CN=Saint Jacquet Distribution, OU=Mobile, O=Saint Jacquet, L=Douala, ST=Littoral, C=CM"
            "$BT/zipalign" -p 4 \
              android/app/build/outputs/apk/release/app-release-unsigned.apk \
              /tmp/app-release-aligned.apk
            "$BT/apksigner" sign --ks /tmp/release.p12 --ks-pass pass:SjDist2026! \
              --out artifacts-android/Saint-Jacquet-Distribution.apk \
              /tmp/app-release-aligned.apk
            rm -f /tmp/release.p12 /tmp/app-release-aligned.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk artifacts-android/Saint-Jacquet-Distribution.apk
          fi

      - name: Publication des artefacts Android (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Saint-Jacquet-Distribution-Android
          path: artifacts-android/*
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Compiler iOS (Xcode / IPA signé ou Ad-Hoc)
    runs-on: macos-latest
    env:
      IOS_CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERT_PWD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROV_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installation des dépendances npm
        run: npm ci

      - name: Synchronisation Capacitor iOS et installation CocoaPods
        env:
          CI_UNSIGNED_IOS: ${{ env.IOS_CERT_B64 == '' && 'true' || 'false' }}
        run: npx cap sync ios

      - name: Compilation & Signature officielle Apple (si secrets configurés)
        if: env.IOS_CERT_B64 != '' && env.IOS_PROV_B64 != ''
        run: |
          mkdir -p artifacts-ios "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_CERT_B64" | base64 --decode > /tmp/cert.p12
          echo "$IOS_PROV_B64" | base64 --decode > /tmp/profile.mobileprovision

          KEYCHAIN_PWD="TempKeychain2026!"
          security create-keychain -p "$KEYCHAIN_PWD" /tmp/ios-build.keychain-db
          security set-keychain-settings -lut 21600 /tmp/ios-build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PWD" /tmp/ios-build.keychain-db
          security import /tmp/cert.p12 -P "$IOS_CERT_PWD" -A -t cert -f pkcs12 -k /tmp/ios-build.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" /tmp/ios-build.keychain-db
          security list-keychains -d user -s /tmp/ios-build.keychain-db login.keychain-db

          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /tmp/profile.plist)
          TEAM="${IOS_TEAM_ID:-$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /tmp/profile.plist)}"
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          if /usr/libexec/PlistBuddy -c "Print ProvisionsAllDevices" /tmp/profile.plist >/dev/null 2>&1; then
            METHOD="enterprise"
          elif /usr/libexec/PlistBuddy -c "Print ProvisionedDevices" /tmp/profile.plist >/dev/null 2>&1; then
            ALLOW_DEBUG=$(/usr/libexec/PlistBuddy -c "Print Entitlements:get-task-allow" /tmp/profile.plist 2>/dev/null || echo "false")
            if [ "$ALLOW_DEBUG" = "true" ]; then METHOD="development"; else METHOD="ad-hoc"; fi
          else
            METHOD="app-store-connect"
          fi
          echo "Mode d'export Apple détecté : $METHOD (Team: $TEAM, Profil: $UUID)"

          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$METHOD</string>
            <key>teamID</key>
            <string>$TEAM</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.saintjacquet.distribution</key>
              <string>$UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath /tmp/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$UUID" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath /tmp/ipa-out

          cp /tmp/ipa-out/*.ipa artifacts-ios/Saint-Jacquet-Distribution.ipa

          # Manifest OTA (installation directe iPhone via lien HTTPS itms-services://)
          cat > artifacts-ios/manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>https://github.com/${{ github.repository }}/releases/download/v1.3.0/Saint-Jacquet-Distribution.ipa</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>com.saintjacquet.distribution</string>
                  <key>bundle-version</key>
                  <string>1.3.0</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>Saint Jacquet Distribution</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF

          # Envoi automatique vers TestFlight si la clé App Store Connect est configurée
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_PRIVATE_KEY" ]; then
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            echo "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            xcrun altool --upload-app --type ios \
              -f artifacts-ios/Saint-Jacquet-Distribution.ipa \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID"
            rm -rf "$HOME/.appstoreconnect/private_keys"
          fi

          security delete-keychain /tmp/ios-build.keychain-db || true
          rm -f /tmp/cert.p12 /tmp/profile.mobileprovision /tmp/profile.plist

      - name: Compilation Xcode Release sans certificat (si secrets non configurés)
        if: env.IOS_CERT_B64 == '' || env.IOS_PROV_B64 == ''
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/App/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build
          mkdir -p artifacts-ios Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          codesign --force --deep --sign - Payload/App.app
          zip -qry artifacts-ios/Saint-Jacquet-Distribution.ipa Payload
          rm -rf Payload

      - name: Publication de l'artefact iOS (IPA)
        uses: actions/upload-artifact@v4
        with:
          name: Saint-Jacquet-Distribution-iOS
          path: artifacts-ios/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publier les fichiers directs (.apk & .ipa sans .zip)
    needs: [build-android, build-ios]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupération du dossier Web / PWA (www)
        uses: actions/checkout@v4

      - name: Téléchargement des binaires compilés
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Publication sur GitHub Releases (PWA + liens directs .apk, .ipa, .aab)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-flat
          (cd www && zip -qry ../dist-flat/Saint-Jacquet-Distribution-PWA.zip .)
          find release-files -type f \( -name "*.apk" -o -name "*.ipa" -o -name "*.aab" -o -name "*.plist" \) -exec cp {} dist-flat/ \;
          ls -lh dist-flat/
          TAG="v1.4.0"
          TITLE="Saint Jacquet Distribution v1.4.0 (PWA prête à l'emploi + APK & IPA)"
          NOTES=$'Fichiers prêts à envoyer :\n\n- **Lien PWA direct (iPhone & Android, 100 % gratuit)** : https://rawcdn.githack.com/${{ github.repository }}/${{ github.sha }}/www/index.html\n- **Pack modèle PWA (.zip hébergeable partout)** : `Saint-Jacquet-Distribution-PWA.zip`\n- **Android (.apk direct)** : `Saint-Jacquet-Distribution.apk`\n- **iOS (.ipa direct)** : `Saint-Jacquet-Distribution.ipa`'
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-flat/* --clobber -R "${{ github.repository }}"
          else
            gh release create "$TAG" dist-flat/* \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              -R "${{ github.repository }}"
          fi
          for OLD_TAG in v1.3.0 v1.2.0 v1.1.0 v1.0.0; do
            if gh release view "$OLD_TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "$OLD_TAG" dist-flat/* --clobber -R "${{ github.repository }}"
            fi
          done
