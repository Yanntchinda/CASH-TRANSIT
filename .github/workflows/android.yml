name: Build Android APK

on:
  push:
    branches:
      - 'arena/0b725d85-cash-transit'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "::notice::ANDROID_HOME=${ANDROID_HOME:-not-set}, ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"
          for path in "${ANDROID_HOME:-/missing}" /usr/local/lib/android/sdk /opt/android-sdk; do
            [ ! -d "$path" ] || echo "::notice::$path: $(ls -1 "$path" | tr '\n' ' ')"
          done
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' > sdk-install.log 2>&1 || {
            tail -60 sdk-install.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: |
          gradle --no-daemon assembleDebug > build.log 2>&1 || {
            tail -100 build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fast-cargo-demo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish demo APK on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk fast-cargo-demo.apk
          if gh release view fast-cargo-demo-1.3.0-0b725d85 >/dev/null 2>&1; then
            gh release upload fast-cargo-demo-1.3.0-0b725d85 fast-cargo-demo.apk --clobber
          else
            gh release create fast-cargo-demo-1.3.0-0b725d85 fast-cargo-demo.apk \
              --target "$GITHUB_SHA" \
              --title "Fast Cargo Android — démonstration" \
              --notes "Version de démonstration signée avec une clé de debug. Android 6.0 ou ultérieur. Données stockées localement sur l'appareil ; paiements non réels."
          fi
